<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ByteMind — Identity Verification Console</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: '#0B1016',
              panel: '#111925',
              panel2: '#0E1520',
              line: '#22314A',
              line2: '#1A2740',
              signal: '#49D6C6',
              signaldim: '#2A6E68',
              amber: '#E8A23D',
              danger: '#E5484D',
              safe: '#49D6C6',
              ink2: '#8FA0BA',
              inktext: '#E9EEF6',
            },
            fontFamily: {
              display: ['"Space Grotesk"', 'sans-serif'],
              body: ['"IBM Plex Sans"', 'sans-serif'],
              mono: ['"IBM Plex Mono"', 'monospace'],
            },
          },
        },
      }
    </script>

    <style>
      html { background: #0B1016; }
      body {
        font-family: 'IBM Plex Sans', sans-serif;
        background: #0B1016;
        color: #E9EEF6;
      }
      ::selection { background: #49D6C6; color: #0B1016; }
      .scanline-bg {
        background-image: repeating-linear-gradient(
          to bottom,
          rgba(73, 214, 198, 0.035) 0px,
          rgba(73, 214, 198, 0.035) 1px,
          transparent 1px,
          transparent 3px
        );
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #0B1016; }
      ::-webkit-scrollbar-thumb { background: #22314A; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
